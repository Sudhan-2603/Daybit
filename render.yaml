services:
  - type: web
    name: daybit-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: RUST_LOG
        value: info,daybit_backend=debug
      - key: FIREBASE_API_KEY
        value: AIzaSyAyrC1S8pwDBHDDN8xQlttqVRv4T-eWnU4
