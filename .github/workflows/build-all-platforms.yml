name: Build All Cross-Platform Apps (Windows, Ubuntu, Arch Linux, Android APK)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (EXE & MSI Installer)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Build Windows Tauri Bundle (EXE & MSI)
        run: |
          npx @tauri-apps/cli build --bundles msi,nsis

      - name: Organize Windows Release Binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows | Out-Null
          Get-ChildItem -Path . -Recurse -Include *.msi, *setup.exe | Where-Object { $_.FullName -notlike "*node_modules*" } | ForEach-Object {
            Copy-Item $_.FullName -Destination dist-windows/ -Force
          }
          Get-ChildItem -Path dist-windows

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Daybit-Windows-Installers
          path: dist-windows/
          if-no-files-found: error

  build-linux:
    name: Linux (Ubuntu .deb & Arch Linux .AppImage)
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf squashfs-tools libfuse2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Build Linux Tauri Bundle (deb & AppImage)
        run: |
          npx @tauri-apps/cli build --bundles deb,appimage || npx @tauri-apps/cli build --bundles deb

      - name: Organize Linux Release Binaries
        run: |
          mkdir -p dist-linux
          find . -type f \( -name "*.deb" -o -name "*.AppImage" \) ! -path "*/node_modules/*" -exec cp {} dist-linux/ \; || true
          ls -la dist-linux/

      - name: Upload Linux Artifacts (Ubuntu & Arch)
        uses: actions/upload-artifact@v4
        with:
          name: Daybit-Linux-Ubuntu-Arch
          path: dist-linux/
          if-no-files-found: warn

  build-android:
    name: Android (Mobile APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build frontend & Sync Android
        run: |
          cd frontend
          npm run build
          npx @capacitor/cli sync android || npx @capacitor/cli copy android || true

      - name: Assemble Android APK with Gradle
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Organize Android APK Release
        run: |
          mkdir -p dist-android
          find frontend/android -name "*.apk" -exec cp {} dist-android/Daybit-v0.2.0.apk \; || true
          ls -la dist-android/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daybit-Android-APK
          path: dist-android/
          if-no-files-found: warn

  release:
    name: Publish GitHub Release (When Tagged)
    needs: [build-windows, build-linux, build-android]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-releases

      - name: Show collected release files
        run: |
          ls -la all-releases/

      - name: Create GitHub Release with all platform packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Daybit ${{ github.ref_name }} - Multi-Platform Release (Windows, Ubuntu, Arch Linux, Android)
          body: |
            ## 🚀 Daybit ${{ github.ref_name }} Release
            
            Multi-platform native builds for Daybit - Minimalist, Real-Time Task Management Suite.

            ### 📦 All-Platform Installers & Binaries:
            - **🪟 Windows:** Download `Daybit-Setup.exe` (NSIS) or `Daybit.msi` for full installation on Windows 10 & 11.
            - **🐧 Ubuntu / Debian:** Install `daybit_0.2.0_amd64.deb` using `sudo dpkg -i daybit_0.2.0_amd64.deb`.
            - **🐧 Arch Linux / Universal Linux:** Run `Daybit-0.2.0.AppImage` using `chmod +x Daybit-0.2.0.AppImage && ./Daybit-0.2.0.AppImage`.
            - **📱 Mobile Android:** Download and tap `Daybit-v0.2.0.apk` to install on Android (Android 7.0 - 14+).

            ### ✨ What's New in v0.2.0:
            - **Connect Day - Personal AI Assistance:** Programmatic API Key Generator in Settings (General) with full Tasks access scope and instant copy.
            - **Mobile-Optimized Layouts:** 2-column paired task and dashboard cards, fluid auto-layout calendar timeline, and capsule floating dock.
            - **Offline & Standalone Ready:** Native desktop windows with zero `localhost` refused connection issues.
            - **Live Database Sync:** Instant sync with MongoDB Atlas and high-speed Axum Rust backend.
          files: |
            all-releases/Daybit-Windows-Installers/*
            all-releases/Daybit-Linux-Ubuntu-Arch/*
            all-releases/Daybit-Android-APK/*
          draft: false
          prerelease: false
          generate_release_notes: false
