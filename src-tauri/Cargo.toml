[package]
name = "daybit-desktop"
version = "0.1.0"
description = "Daybit Cross-Platform Task Manager Shell"
authors = ["Daybit Team"]
edition = "2021"

[lib]
name = "daybit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-notification = "2.0.0"
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

